version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: bilingual_redis
    expose:
      - "6379"
    volumes:
      - /home/ubuntu/configs/my-book-translator/redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build: .
    container_name: bilingual_app
    expose:
      - "8000"
    volumes:
      - /home/ubuntu/configs/my-book-translator/uploads:/app/uploads
      - /home/ubuntu/configs/my-book-translator/outputs:/app/outputs
      - /home/ubuntu/configs/my-book-translator/books:/app/books  # For existing books
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "
        # Wait for Redis
        sleep 5 &&
        
        # Start Celery worker in background
        celery -A api.tasks worker --loglevel=info --detach &&
        
        # Start FastAPI server
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
      "

  worker:
    build: .
    container_name: bilingual_worker
    volumes:
      - /home/ubuntu/configs/my-book-translator/uploads:/app/uploads
      - /home/ubuntu/configs/my-book-translator/outputs:/app/outputs
      - /home/ubuntu/configs/my-book-translator/books:/app/books
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A api.tasks worker --loglevel=info --concurrency=2
